{% extends 'base.html' %}
{% block title %}Password Changed — ProjectFlow{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="empty-icon">
                <span class="material-icons">check_circle</span>
            </div>
            <h1 class="auth-title">Password Changed</h1>
            <p class="auth-subtitle">Your password has been updated successfully.</p>
        </div>
        <div class="auth-footer">
            <a href="{% url 'core:dashboard' %}" class="btn btn-primary btn-full">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
