{% extends 'base.html' %}
{% block title %}Check Your Email — ProjectFlow{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Check Your Email</h1>
            <p class="auth-subtitle">We've sent a password reset link to your email.</p>
        </div>
        <div class="auth-footer">
            <a href="{% url 'accounts:login' %}">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
