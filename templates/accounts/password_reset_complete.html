{% extends 'base.html' %}
{% block title %}Password Reset Complete — ProjectFlow{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Password Reset Complete</h1>
            <p class="auth-subtitle">Your password has been set. You can now log in.</p>
        </div>
        <div class="auth-footer">
            <a href="{% url 'accounts:login' %}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
