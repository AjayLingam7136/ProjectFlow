{% extends 'base.html' %}
{% block title %}Delete Comment — ProjectFlow{% endblock %}
{% block topbar_title %}Delete Comment{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2 class="mb-2">Delete Comment</h2>
        <p class="text-secondary mb-3">Are you sure you want to delete this comment?</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <a href="{% url 'issues:detail' view.kwargs.pk %}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-danger">Delete Comment</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
