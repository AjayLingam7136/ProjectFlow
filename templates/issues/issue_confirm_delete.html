{% extends 'base.html' %}
{% block title %}Delete Issue — ProjectFlow{% endblock %}
{% block topbar_title %}Delete Issue{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2 class="mb-2">Delete Issue</h2>
        <p class="text-secondary mb-3">Are you sure you want to delete <strong>"{{ object.title }}"</strong>? This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <a href="{% url 'issues:detail' object.pk %}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-danger">Delete Issue</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
